<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Satisfaction Survey</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: #333333;
        }

        p.description {
            color: #666666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444444;
        }

        .required {
            color: red;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-option, .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
        }

        .radio-option input, .checkbox-option input {
            cursor: pointer;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .matrix-table th, .matrix-table td {
            border: 1px solid #e0e0e0;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }

        .matrix-table th {
            background-color: #f9f9f9;
        }

        .matrix-table td:first-child {
            text-align: left;
            font-weight: normal;
        }

        .btn-submit {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Customer Satisfaction Survey</h2>
        <p class="description">Xin vui lòng dành ít phút để hoàn thành khảo sát dưới đây nhằm giúp chúng tôi nâng cao chất lượng dịch vụ.</p>

        <form action="#" method="POST">
            <!-- Tên khách hàng -->
            <div class="form-group">
                <label>Họ và Tên <span class="required">*</span></label>
                <input type="text" placeholder="Nhập họ và tên..." required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" placeholder="example@email.com" required>
            </div>

            <!-- Tần suất sử dụng -->
            <div class="form-group">
                <label>Bạn sử dụng sản phẩm/dịch vụ của chúng tôi bao lâu một lần?</label>
                <select>
                    <option value="">-- Chọn tần suất --</option>
                    <option value="daily">Hàng ngày</option>
                    <option value="weekly">Hàng tuần</option>
                    <option value="monthly">Hàng tháng</option>
                    <option value="rarely">Hiếm khi</option>
                </select>
            </div>

            <!-- Đánh giá bằng Ma trận -->
            <div class="form-group">
                <label>Đánh giá sự hài lòng của bạn đối với các yếu tố sau:</label>
                <table class="matrix-table">
                    <thead>
                        <tr>
                            <th>Yếu tố</th>
                            <th>Rất không hài lòng</th>
                            <th>Không hài lòng</th>
                            <th>Bình thường</th>
                            <th>Hài lòng</th>
                            <th>Rất hài lòng</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Chất lượng sản phẩm</td>
                            <td><input type="radio" name="quality" value="1"></td>
                            <td><input type="radio" name="quality" value="2"></td>
                            <td><input type="radio" name="quality" value="3"></td>
                            <td><input type="radio" name="quality" value="4"></td>
                            <td><input type="radio" name="quality" value="5"></td>
                        </tr>
                        <tr>
                            <td>Dịch vụ hỗ trợ</td>
                            <td><input type="radio" name="service" value="1"></td>
                            <td><input type="radio" name="service" value="2"></td>
                            <td><input type="radio" name="service" value="3"></td>
                            <td><input type="radio" name="service" value="4"></td>
                            <td><input type="radio" name="service" value="5"></td>
                        </tr>
                        <tr>
                            <td>Giá cả</td>
                            <td><input type="radio" name="price" value="1"></td>
                            <td><input type="radio" name="price" value="2"></td>
                            <td><input type="radio" name="price" value="3"></td>
                            <td><input type="radio" name="price" value="4"></td>
                            <td><input type="radio" name="price" value="5"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Khả năng giới thiệu -->
            <div class="form-group">
                <label>Bạn có sẵn sàng giới thiệu chúng tôi cho bạn bè không?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="recommend" value="yes"> Chắc chắn có</label>
                    <label class="radio-option"><input type="radio" name="recommend" value="maybe"> Có thể</label>
                    <label class="radio-option"><input type="radio" name="recommend" value="no"> Không</label>
                </div>
            </div>

            <!-- Ý kiến đóng góp -->
            <div class="form-group">
                <label for="feedback">Ý kiến đóng góp thêm:</label>
                <textarea id="feedback" rows="4" placeholder="Nhập phản hồi của bạn tại đây..."></textarea>
            </div>

            <!-- Nút gửi -->
            <button type="submit" class="btn-submit">Gửi khảo sát</button>
        </form>
    </div>

</body>
</html>
