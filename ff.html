<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #cccccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <!-- 1. Tiêu đề h1 -->
    <h1>Danh sách sản phẩm</h1>

    <!-- 2. Bảng chứa các cột Tên sản phẩm, Giá, Số lượng và 4 sản phẩm mẫu -->
    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Điện thoại iPhone 15</td>
                <td>22.990.000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>35.500.000 VNĐ</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Tai nghe Sony WH-1000XM5</td>
                <td>7.990.000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Keychron K2</td>
                <td>1.850.000 VNĐ</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
